<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter View — onTarget 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #060810; --bg-card: #10172a; --bg-card2: #161f38;
    --accent: #4d9de0; --accent2: #72b9f5; --accent-warm: #f4a261;
    --border: rgba(77,157,224,0.28); --border-dim: rgba(255,255,255,0.08);
    --text: #e4e8f2; --text-dim: #8997b0; --text-dimmer: #475569;
    --green: #3cb97c; --yellow: #d4a44b;
  }
  html, body { width: 100%; height: 100%; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text); overflow: hidden; }

  /* ── Header bar ── */
  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid var(--border-dim);
    background: var(--bg-card); flex-shrink: 0;
  }
  #slide-meta { display: flex; flex-direction: column; gap: 3px; }
  #slide-counter { font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent2); }
  #slide-title { font-size: 16px; font-weight: 800; color: #fff; }
  #timer-display { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--text-dimmer); cursor: pointer; user-select: none;
    letter-spacing: -1px; }
  #timer-display.running { color: var(--green); }
  #timer-display.warn    { color: var(--yellow); }
  #timer-label { font-size: 9px; text-align: center; color: var(--text-dimmer);
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; cursor: pointer; }

  /* ── Notes area ── */
  #notes-area {
    padding: 28px 36px 90px; overflow-y: auto;
    height: calc(100vh - 72px);
  }
  #notes-content { font-size: 19px; line-height: 1.85; color: #c8d0e0; }
  #notes-content strong { color: #fff; }
  #notes-content em {
    display: block; font-style: normal;
    font-size: 13px; font-weight: 700; color: var(--accent2);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border-dim);
  }

  /* ── Waiting state ── */
  #waiting {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 60vh; gap: 14px; text-align: center;
  }
  #waiting .icon { font-size: 40px; }
  #waiting .msg { font-size: 16px; color: var(--text-dim); }
  #waiting .hint { font-size: 13px; color: var(--text-dimmer); max-width: 360px; line-height: 1.6; }

  /* ── Next slide footer ── */
  #footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px 24px; background: var(--bg-card2);
    border-top: 1px solid var(--border-dim);
    display: flex; align-items: center; gap: 10px;
    font-size: 12px;
  }
  #footer .label { color: var(--text-dimmer); text-transform: uppercase;
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em; }
  #next-title { color: var(--text-dim); }

  /* ── Progress bar ── */
  #progress {
    position: fixed; top: 0; left: 0; height: 3px;
    background: var(--accent); transition: width 0.3s ease; z-index: 10;
  }
</style>
</head>
<body>

<div id="progress"></div>

<div id="header">
  <div id="slide-meta">
    <div id="slide-counter">Waiting for presentation…</div>
    <div id="slide-title"></div>
  </div>
  <div style="text-align:center">
    <div id="timer-display" onclick="toggleTimer()" title="Click to start/stop · Double-click to reset">0:00</div>
    <div id="timer-label" onclick="toggleTimer()">click to start</div>
  </div>
</div>

<div id="notes-area">
  <div id="waiting">
    <div class="icon">🖥️</div>
    <div class="msg">Presenter View ready</div>
    <div class="hint">Open the main presentation in another window — notes will sync automatically as you advance slides.</div>
  </div>
  <div id="notes-content" style="display:none"></div>
</div>

<div id="footer">
  <span class="label">Next →</span>
  <span id="next-title">—</span>
</div>

<script>
  const TOTAL = 17;
  const SLIDE_TITLES = {
    1: 'Title',
    2: 'Context — The PAN TW Team',
    3: 'Our Organization — Two Pillars',
    4: 'The Problem',
    5: 'The Approach — Not Copilot. Agentic.',
    6: 'The Platform — Why Cursor',
    7: 'The Skills Library',
    8: 'The ADLC',
    9: 'Deep Dive — TW Feature Doc',
    10: 'Broader Impact',
    11: 'Doc Health Initiative',
    12: 'Day in the Life',
    13: 'The Numbers',
    14: 'Role Evolution',
    15: 'Lessons Learned',
    16: 'Key Takeaways',
    17: 'Thank You',
  };

  // ── BroadcastChannel sync ──────────────────────────────────────────────────
  const channel = new BroadcastChannel('onTarget-2026-presenter');

  channel.onmessage = function(e) {
    const d = e.data;
    if (d.type === 'slide') {
      const n = d.slide;
      document.getElementById('slide-counter').textContent = 'Slide ' + n + ' of ' + d.total;
      document.getElementById('slide-title').textContent   = SLIDE_TITLES[n] || '';
      document.getElementById('notes-content').innerHTML   = d.notes || '(no notes for this slide)';
      document.getElementById('notes-content').style.display = 'block';
      document.getElementById('waiting').style.display    = 'none';
      document.getElementById('next-title').textContent   = SLIDE_TITLES[n + 1] || '— (last slide)';
      document.getElementById('progress').style.width     = ((n / d.total) * 100) + '%';
      document.getElementById('notes-area').scrollTop     = 0;
    }
    if (d.type === 'timer') {
      renderTimer(d.timer, d.timerRunning);
      // Keep local timer in sync
      if (d.timerRunning && !timerRunning) {
        timerElapsed = d.timer;
        timerStart = Date.now() - timerElapsed * 1000;
        timerInterval = setInterval(localTick, 500);
        timerRunning = true;
      }
      if (!d.timerRunning && timerRunning) {
        clearInterval(timerInterval); timerRunning = false; timerElapsed = d.timer;
      }
    }
  };

  // Request current state on open
  setTimeout(function() {
    channel.postMessage({ type: 'request-state' });
  }, 200);

  // ── Local timer (for smooth updates between broadcasts) ────────────────────
  let timerStart = null, timerInterval = null, timerRunning = false, timerElapsed = 0;

  function localTick() {
    const s = Math.floor((Date.now() - timerStart) / 1000);
    renderTimer(s, true);
  }
  function renderTimer(s, running) {
    const m = Math.floor(s / 60);
    const el = document.getElementById('timer-display');
    el.textContent = m + ':' + String(s % 60).padStart(2, '0');
    el.className = running ? (s >= 1800 ? 'warn' : 'running') : '';
    document.getElementById('timer-label').textContent = running ? 'running' : 'click to start';
  }
  function toggleTimer() {
    channel.postMessage({ type: 'toggle-timer' }); // tell main window to toggle
  }
  document.getElementById('timer-display').addEventListener('dblclick', function(e) {
    e.stopPropagation();
    channel.postMessage({ type: 'reset-timer' });
  });
</script>
</body>
</html>
