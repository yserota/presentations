<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presenter View — Q1 FY2027 QBR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #080a10; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e8eaf0; }

    /* ── Top bar ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: #0f1117; border-bottom: 1px solid #1f2937;
      display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 200;
    }
    #topbar .brand { font-size: 12px; color: #6b7280; letter-spacing: 0.3px; flex: 1; }
    #topbar .timer { font-size: 13px; font-weight: 600; color: #4ade80; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
    #topbar .timer.warn { color: #fbbf24; }
    #topbar .timer.over { color: #f87171; }
    .sync-btn {
      background: #1a1d27; border: 1px solid #3d4158; color: #a78bfa;
      border-radius: 6px; padding: 4px 12px; font-size: 11px; cursor: pointer;
      letter-spacing: 0.4px; transition: background 0.15s;
    }
    .sync-btn:hover { background: #252940; }
    .sync-indicator {
      font-size: 11px; padding: 3px 10px; border-radius: 12px; letter-spacing: 0.3px;
    }
    .sync-indicator.synced { background: #0d2a1a; color: #4ade80; border: 1px solid #166534; }
    .sync-indicator.drifted { background: #2a1a0d; color: #fbbf24; border: 1px solid #92400e; }

    /* ── Main panels ── */
    #panels {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: 58fr 42fr;
      gap: 0;
    }

    /* ── Left: slide panel ── */
    #slide-panel {
      display: flex; flex-direction: column;
      border-right: 2px solid #1f2937;
      background: #000;
    }
    #slide-frame {
      flex: 1; border: none; width: 100%; display: block;
    }
    #slide-nav {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 10px 20px; background: #0f1117; border-top: 1px solid #1f2937;
      flex-shrink: 0;
    }
    #slide-nav .nav-label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
    #slide-nav .counter { font-size: 13px; font-weight: 600; color: #c9cdd8; min-width: 54px; text-align: center; }

    /* ── Right: notes panel ── */
    #notes-panel {
      display: flex; flex-direction: column; background: #0b0e18;
      overflow: hidden;
    }
    #notes-header {
      padding: 14px 20px 10px; border-bottom: 1px solid #1f2937;
      flex-shrink: 0;
    }
    #notes-header .slide-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
      color: #5b7cf6; margin-bottom: 2px;
    }
    #notes-header .slide-title-text {
      font-size: 16px; font-weight: 700; color: #f0f2fb; margin-bottom: 2px;
    }
    #notes-header .slide-timing {
      font-size: 11px; color: #6b7280;
    }
    #notes-content {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      scrollbar-width: thin; scrollbar-color: #2e3244 transparent;
    }

    /* ── Notes typography ── */
    .script { margin-bottom: 14px; }
    .script p {
      font-size: 14px; line-height: 1.7; color: #e5e7eb;
      margin-bottom: 10px; padding-left: 12px;
      border-left: 3px solid #3d4158;
    }
    .script p:last-child { margin-bottom: 0; }
    .notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .note-box { background: #111827; border-radius: 6px; padding: 10px 12px; }
    .note-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .note-label.why    { color: #4ade80; }
    .note-label.avoid  { color: #f87171; }
    .note-label.qa     { color: #a78bfa; }
    .note-label.timing { color: #fbbf24; }
    .note-body { font-size: 12px; color: #c9cdd8; line-height: 1.6; }
    .qa-q { font-style: italic; color: #d1d5db; margin-bottom: 4px; font-size: 12px; }
    .qa-a { color: #4ade80; font-size: 12px; padding-left: 8px; border-left: 2px solid #4ade80; }

    /* ── Notes nav ── */
    #notes-nav {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 10px 20px; background: #0f1117; border-top: 1px solid #1f2937;
      flex-shrink: 0;
    }
    #notes-nav .nav-label { font-size: 11px; color: #9333ea; text-transform: uppercase; letter-spacing: 0.5px; }
    #notes-nav .counter { font-size: 13px; font-weight: 600; color: #c9cdd8; min-width: 54px; text-align: center; }

    /* ── Shared nav button style ── */
    .nav-btn {
      background: #1a1d27; border: 1px solid #3d4158; color: #c9cdd8;
      border-radius: 6px; padding: 5px 14px; font-size: 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: #353852; }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }
    .nav-btn.purple { border-color: #7c3aed; color: #a78bfa; }
    .nav-btn.purple:hover:not(:disabled) { background: #1e1a3c; }

    /* ── Next-up preview ── */
    #next-up {
      padding: 8px 20px; background: #080a10; border-top: 1px solid #1f2937;
      font-size: 11px; color: #4b5563; letter-spacing: 0.2px; flex-shrink: 0;
    }
    #next-up span { color: #6b7280; }

    /* ── Empty state ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: #4b5563; font-size: 13px; text-align: center; gap: 8px;
    }
    .empty-state strong { color: #6b7280; font-size: 15px; }

    /* ── Keyboard hint ── */
    .kbd { display: inline-block; background: #1a1d27; border: 1px solid #3d4158; border-radius: 3px; padding: 1px 5px; font-size: 10px; color: #9ca3af; font-family: monospace; }
  </style>
</head>
<body>

<!-- ── Top bar ── -->
<div id="topbar">
  <span class="brand">Q1 FY2027 QBR &nbsp;·&nbsp; Presenter View</span>
  <span style="font-size:11px;color:#4b5563;">
    <span class="kbd">←→</span> slides &nbsp;
    <span class="kbd">Shift+←→</span> notes only &nbsp;
    <span class="kbd">S</span> sync
  </span>
  <span class="sync-indicator synced" id="sync-indicator">⟳ Synced</span>
  <button class="sync-btn" onclick="syncNotesToSlide()">↕ Sync Notes</button>
  <span class="timer" id="timer">00:00</span>
  <button class="nav-btn" onclick="resetTimer()" style="font-size:10px;padding:3px 9px;">Reset</button>
</div>

<!-- ── Panels ── -->
<div id="panels">

  <!-- Left: slide frame -->
  <div id="slide-panel">
    <iframe id="slide-frame" src="index.html"></iframe>
    <div id="slide-nav">
      <span class="nav-label">Slides</span>
      <button class="nav-btn" id="slide-prev" onclick="slideGo(-1)" disabled>← Prev</button>
      <span class="counter" id="slide-counter">1 / 8</span>
      <button class="nav-btn" id="slide-next" onclick="slideGo(1)">Next →</button>
    </div>
  </div>

  <!-- Right: notes panel -->
  <div id="notes-panel">
    <div id="notes-header">
      <div class="slide-label" id="notes-slide-label">Slide 1</div>
      <div class="slide-title-text" id="notes-slide-title">Loading…</div>
      <div class="slide-timing" id="notes-slide-timing"></div>
    </div>
    <div id="notes-content">
      <div class="empty-state"><strong>Loading speaker notes…</strong></div>
    </div>
    <div id="next-up">Next: <span id="next-title">—</span></div>
    <div id="notes-nav">
      <span class="nav-label">Notes</span>
      <button class="nav-btn purple" id="notes-prev" onclick="notesGo(-1)" disabled>← Prev</button>
      <span class="counter" id="notes-counter">1 / 8</span>
      <button class="nav-btn purple" id="notes-next" onclick="notesGo(1)">Next →</button>
    </div>
  </div>

</div>

<script>
  // ── State ──
  let notesBlocks = [];
  let slideCurrent = 1;   // 1-based, mirrors exec.html
  let notesCurrent = 1;   // 1-based, independent
  let slideTotal = 8;
  let timerStart = null;
  let timerInterval = null;

  // ── Timer ──
  function startTimer() {
    if (timerInterval) return;
    timerStart = Date.now();
    timerInterval = setInterval(tickTimer, 1000);
  }
  function resetTimer() {
    clearInterval(timerInterval); timerInterval = null; timerStart = null;
    document.getElementById('timer').textContent = '00:00';
    document.getElementById('timer').className = 'timer';
  }
  function tickTimer() {
    const elapsed = Math.floor((Date.now() - timerStart) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    const el = document.getElementById('timer');
    el.textContent = `${m}:${s}`;
    el.className = elapsed < 720 ? 'timer' : elapsed < 900 ? 'timer warn' : 'timer over';
  }

  // ── Load notes ──
  async function loadNotes() {
    try {
      const res = await fetch('speaker-notes.html');
      if (!res.ok) throw new Error('fetch failed');
      const text = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'text/html');
      notesBlocks = Array.from(doc.querySelectorAll('.slide-block'));
      slideTotal = notesBlocks.length;
      updateSlideCounter();
      showNotes();
    } catch(e) {
      document.getElementById('notes-content').innerHTML =
        `<div class="empty-state"><strong>Could not load notes</strong><span>Open from a web server (GitHub Pages) rather than a local file://</span></div>`;
    }
  }

  // ── Show notes for notesCurrent ──
  function showNotes() {
    if (!notesBlocks.length) return;
    const idx = notesCurrent - 1;
    const block = notesBlocks[idx];
    if (!block) return;

    // Header
    const numEl    = block.querySelector('.slide-num');
    const titleEl  = block.querySelector('.slide-title');
    const timingEl = block.querySelector('.slide-timing');
    document.getElementById('notes-slide-label').textContent  = numEl    ? numEl.textContent    : `Slide ${notesCurrent}`;
    document.getElementById('notes-slide-title').textContent  = titleEl  ? titleEl.textContent  : '';
    document.getElementById('notes-slide-timing').textContent = timingEl ? timingEl.textContent : '';

    // Body — extract script + notes-grid only
    const scriptEl = block.querySelector('.script');
    const gridEl   = block.querySelector('.notes-grid');
    let html = '';
    if (scriptEl) html += `<div class="script">${scriptEl.innerHTML}</div>`;
    if (gridEl)   html += `<div class="notes-grid">${gridEl.innerHTML}</div>`;
    document.getElementById('notes-content').innerHTML = html || block.innerHTML;

    // Next-up preview
    const nextIdx = idx + 1;
    if (nextIdx < notesBlocks.length) {
      const nextTitle = notesBlocks[nextIdx].querySelector('.slide-title');
      document.getElementById('next-title').textContent = nextTitle ? nextTitle.textContent : `Slide ${notesCurrent + 1}`;
    } else {
      document.getElementById('next-title').textContent = '(end of deck)';
    }

    // Counters + buttons
    document.getElementById('notes-counter').textContent = `${notesCurrent} / ${slideTotal}`;
    document.getElementById('notes-prev').disabled = notesCurrent <= 1;
    document.getElementById('notes-next').disabled = notesCurrent >= slideTotal;

    updateSyncIndicator();
  }

  // ── Slide navigation (controls iframe) ──
  function slideGo(dir) {
    const frame = document.getElementById('slide-frame');
    try {
      const fw = frame.contentWindow;
      const newSlide = slideCurrent + dir;
      if (newSlide < 1 || newSlide > slideTotal) return;
      fw.go(dir);
      slideCurrent = newSlide;
      // Auto-sync notes
      notesCurrent = slideCurrent;
      showNotes();
      updateSlideCounter();
      startTimer();
    } catch(e) { console.warn('iframe access error', e); }
  }

  function updateSlideCounter() {
    try {
      const fw = document.getElementById('slide-frame').contentWindow;
      const active = fw.document.querySelector('.slide.active');
      if (active) {
        const m = active.id.match(/slide-(\d+)/);
        if (m) slideCurrent = parseInt(m[1]);
      }
    } catch(e) {}
    document.getElementById('slide-counter').textContent = `${slideCurrent} / ${slideTotal}`;
    document.getElementById('slide-prev').disabled = slideCurrent <= 1;
    document.getElementById('slide-next').disabled = slideCurrent >= slideTotal;
    updateSyncIndicator();
  }

  // ── Notes navigation (independent) ──
  function notesGo(dir) {
    const newIdx = notesCurrent + dir;
    if (newIdx < 1 || newIdx > slideTotal) return;
    notesCurrent = newIdx;
    showNotes();
  }

  // ── Sync notes to current slide ──
  function syncNotesToSlide() {
    notesCurrent = slideCurrent;
    showNotes();
  }

  function updateSyncIndicator() {
    const el = document.getElementById('sync-indicator');
    if (slideTotal === 0) return;
    if (notesCurrent === slideCurrent) {
      el.className = 'sync-indicator synced';
      el.textContent = '⟳ Synced';
    } else {
      el.className = 'sync-indicator drifted';
      el.textContent = `⚠ Notes at ${notesCurrent}, Slide at ${slideCurrent}`;
    }
  }

  // ── Keyboard ──
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.shiftKey) {
      // Shift+arrow: move notes only
      if (e.key === 'ArrowRight') { e.preventDefault(); notesGo(1); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); notesGo(-1); }
    } else {
      // Arrow keys: move slide (notes auto-sync)
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); slideGo(1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); slideGo(-1); }
      if (e.key === 's' || e.key === 'S') { e.preventDefault(); syncNotesToSlide(); }
    }
  });

  // ── Init ──
  document.getElementById('slide-frame').addEventListener('load', () => {
    setTimeout(updateSlideCounter, 100);
  });
  loadNotes();
</script>
</body>
</html>
